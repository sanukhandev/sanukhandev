name: DEV.to publishing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'posts/**/*.md'
      - 'scripts/devto_publish.py'
      - 'scripts/linkedin_drafts.py'
      - 'scripts/linkedin_publish.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the DEV.to API key without posting, or publish approved articles
        type: choice
        required: true
        default: verify
        options:
          - verify
          - publish-all

permissions:
  contents: read

concurrency:
  group: devto-publishing
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Markdown articles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Validate front matter
        run: python scripts/devto_publish.py --validate
      - name: Run publisher unit tests
        run: python -m unittest discover -s tests -v

  publish:
    name: Sync approved articles to DEV.to
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: devto-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Publish changed approved articles
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_USERNAME: sanukhandev
          PUSH_BEFORE: ${{ github.event.before }}
          PUBLISH_MODE: ${{ inputs.mode }}
          DEVTO_PUBLISHED_MANIFEST: ${{ runner.temp }}/devto-published.json
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "::error::DEVTO_API_KEY is not configured. Add it to the devto-production environment."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$PUBLISH_MODE" in
              verify) python scripts/devto_publish.py --check-auth ;;
              publish-all) python scripts/devto_publish.py --publish-all ;;
              *) echo "::error::Invalid publishing mode"; exit 1 ;;
            esac
          else
            python scripts/devto_publish.py --publish-changed
          fi

      - name: Generate LinkedIn drafts with published slugs
        if: success()
        run: |
          if [ -f "${{ runner.temp }}/devto-published.json" ]; then
            python scripts/linkedin_drafts.py "${{ runner.temp }}/devto-published.json" "${{ runner.temp }}/linkedin-drafts"
          else
            echo "No publication manifest was produced."
          fi
      - name: Upload LinkedIn drafts for manual review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-drafts-${{ github.run_id }}
          path: ${{ runner.temp }}/linkedin-drafts/*.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Automatically publish confirmed articles to LinkedIn
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ vars.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
        run: |
          if [ ! -f "${{ runner.temp }}/devto-published.json" ]; then
            echo "No confirmed DEV.to publication manifest; skipping LinkedIn."
          elif [ -z "$LINKEDIN_ACCESS_TOKEN" ] || [ -z "$LINKEDIN_AUTHOR_URN" ]; then
            echo "::warning::LinkedIn not configured: set LINKEDIN_ACCESS_TOKEN secret and LINKEDIN_AUTHOR_URN variable in devto-production."
          else
            python scripts/linkedin_publish.py "${{ runner.temp }}/devto-published.json"
          fi
